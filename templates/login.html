<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - بلاغات 937</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif !important; }
        body { background-color: #f4f7f9; color: #2c3e50; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 30px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #eef2f5; text-align: center; }
        .login-card h3 { color: #1F4E78; font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; }
        .mb-3 { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #34495e; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .form-control:focus { border-color: #1F4E78; box-shadow: 0 0 0 3px rgba(31, 78, 120, 0.12); }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer; background-color: #1F4E78; color: #fff; margin-top: 10px; }
        .btn:hover { background-color: #163a5d; }
        .alert-error { background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3>تسجيل الدخول - بلاغات 937</h3>
        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="mb-3">
                <label>اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <label>كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn">دخول</button>
        </form>
    </div>
</body>
</html>
